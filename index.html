<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stephen Joseph — Full-Stack Developer & Corporate Trainer</title>
    <meta
      name="description"
      content="Stephen Joseph builds secure, scalable full-stack applications and runs hands-on Java Full Stack and MERN training programs."
    />
    <meta name="theme-color" content="#f1eee6" />
    <link rel="icon" href="/sjlogo.png" />

    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        root.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0e0e0d" : "#f1eee6");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
